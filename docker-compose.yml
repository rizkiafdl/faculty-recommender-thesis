services:
  api:
    build: .
    container_name: dosen-recommender-api
    command: uvicorn fastapi_app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/recommendation.db}
      DEFAULT_EXCEL_PATH: ${DEFAULT_EXCEL_PATH:-/app/mapping faculty supervisor.xlsx}
      DEFAULT_SHEET_NAME: ${DEFAULT_SHEET_NAME:-Sheet1}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-answerdotai/ModernBERT-base}
      EMBEDDING_FALLBACK_MODEL_NAME: ${EMBEDDING_FALLBACK_MODEL_NAME:-sentence-transformers/all-mpnet-base-v2}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-auto}
      BENCHMARK_MODEL_NAMES: ${BENCHMARK_MODEL_NAMES:-answerdotai/ModernBERT-base,sentence-transformers/all-mpnet-base-v2,sentence-transformers/all-MiniLM-L6-v2}
    volumes:
      - ./data:/app/data

  web:
    build: .
    container_name: dosen-recommender-web
    command: python flask_app.py
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/recommendation.db}
      DEFAULT_EXCEL_PATH: ${DEFAULT_EXCEL_PATH:-/app/mapping faculty supervisor.xlsx}
      DEFAULT_SHEET_NAME: ${DEFAULT_SHEET_NAME:-Sheet1}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-answerdotai/ModernBERT-base}
      EMBEDDING_FALLBACK_MODEL_NAME: ${EMBEDDING_FALLBACK_MODEL_NAME:-sentence-transformers/all-mpnet-base-v2}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-auto}
      BENCHMARK_MODEL_NAMES: ${BENCHMARK_MODEL_NAMES:-answerdotai/ModernBERT-base,sentence-transformers/all-mpnet-base-v2,sentence-transformers/all-MiniLM-L6-v2}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-changeme}
    volumes:
      - ./data:/app/data
    depends_on:
      - api
