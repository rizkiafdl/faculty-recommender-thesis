services:
  web:
    build: .
    container_name: dosen-recommender
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - .env.prod
    volumes:
      - db_data:/app/data
      - hf_cache:/root/.cache/huggingface
    command: gunicorn -w 1 -b 0.0.0.0:5001 --timeout 300 --keep-alive 5 flask_app:app

volumes:
  db_data:
  hf_cache:
